<header class="header">
  <a class="wordmark" routerLink="/" aria-label="Gabriel Daiki Maruyama Romao — início">romao<span>.dev</span></a>
  <nav aria-label="Navegação principal">
    <button class="palette-button" type="button" (click)="paletteChange.emit()"
      [attr.aria-label]="'Paleta ' + paletteName() + '. Alternar para ' + nextPaletteName()"
      [attr.title]="'Trocar para ' + nextPaletteName()">
      <span class="palette-swatches" aria-hidden="true"><i></i><i></i><i></i></span>
      <span class="palette-label" aria-live="polite">{{ paletteName() }}</span>
      <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M20 7v5h-5M4 17v-5h5"/><path d="M6.1 7a7 7 0 0 1 11.8-1L20 9M4 15l2.1 3A7 7 0 0 0 17.9 17"/></svg>
    </button>
    <a class="contact-link" routerLink="/" fragment="contato">Vamos conversar</a>
  </nav>
</header>
